name: CI - Contextes GitHub Actions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_NAME: fastapi-starter

    steps:
      - name: Afficher les informations du dépôt
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
      - name: Afficher les informations du runner
        run: |
          echo "OS: ${{ runner.os }}"
          echo "Architecture: ${{ runner.arch }}"
      - name: Afficher les valeurs de contexte (Q8)
        run: |
          echo "Application: ${{ env.APP_NAME }}"
          echo "Acteur: ${{ github.actor }}"
          echo "Evenement: ${{ github.event_name }}"
          echo "Branche: ${{ github.ref_name }}"
          echo "SHA: ${{ github.sha }}"
          echo "OS du runner: ${{ runner.os }}"
      - name: Afficher les valeurs Q9
        run: |
          echo "event_name: ${{ github.event_name }}"
          echo "head_ref: ${{ github.head_ref }}"
          echo "base_ref: ${{ github.base_ref }}"
          echo "ref_name: ${{ github.ref_name }}"

      - name: Afficher le contexte github complet (Q10)
        run: echo '${{ toJson(github) }}'